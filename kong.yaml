_format_version: "3.0"
_konnect:
  control_plane_name: HDFS-Control-Plan

consumers:
  - username: Test-Consumer
    custom_id: "123"
    keyauth_credentials:
      - key: ${process_env.CONSUMER_API_KEY}

services:
  - name: test-service
    url: http://envoy-service.egress-system.svc.cluster.local:3128/test-api
    retries: 5
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: test-route
        paths:
          - /test-api
        strip_path: false
    plugins:
      - name: key-auth
        enabled: true
        config:
          key_names:
            - apikey
          hide_credentials: true

      - name: rate-limiting-advanced
        enabled: true
        config:
          strategy: redis
          identifier: consumer
          limit:
            - 3
          window_size:
            - 15
          window_type: sliding
          namespace: YNqCE1hLkxlDNwUmPrJY3V1JVxhQ4hRM
          redis:
            host: redis.redis.svc.cluster.local
            port: 6379
            password: ${process_env.REDIS_PASSWORD}
            database: 0
            connect_timeout: 2000
            read_timeout: 2000
            send_timeout: 2000
            keepalive_pool_size: 256
            ssl: false

  - name: payment-service
    url: http://envoy-service.egress-system.svc.cluster.local:3128/test-api
    retries: 5
    connect_timeout: 60000
    read_timeout: 60000
    write_timeout: 60000
    routes:
      - name: payment-route
        paths:
          - /payment
        strip_path: false
    plugins:
      - name: key-auth
        enabled: true
        config:
          key_names:
            - apikey
          hide_credentials: true

      - name: rate-limiting-advanced
        enabled: true
        config:
          strategy: redis
          identifier: consumer
          limit:
            - 3
          window_size:
            - 15
          window_type: sliding
          namespace: YNqCE1hLkxlDNwUmPrJY3V1JVxhQ4hRM
          redis:
            host: redis.redis.svc.cluster.local
            port: 6379
            password: ${process_env.REDIS_PASSWORD}
            database: 0
            connect_timeout: 2000
            read_timeout: 2000
            send_timeout: 2000
            keepalive_pool_size: 256
            ssl: false